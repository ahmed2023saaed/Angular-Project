<div class="container py-5">
  <div class="card shadow-lg p-4 rounded-4">
    <h3 class="mb-4 text-center">Student Registration</h3>

    <form class="row g-4" [formGroup]="myForm" (ngSubmit)="onSubmit()">

      <!-- 🔹 Personal Info -->
      <h5 class="border-bottom pb-2">Personal Information</h5>

      <div class="col-md-4">
        <label class="form-label">First Name</label>
        <input type="text" formControlName="firstName" class="form-control" placeholder="Enter first name">
      </div>

      <div class="col-md-4">
        <label class="form-label">Last Name</label>
        <input type="text" formControlName="lastName" class="form-control" placeholder="Enter last name">
      </div>

      <div class="col-md-4">
        <label class="form-label">Id</label>
        <input type="text" formControlName="id" class="form-control" placeholder="Enter Id">
      </div>

      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="example@email.com">
      </div>

      <div class="col-md-3">
        <label class="form-label">Age</label>
        <input type="number" formControlName="age" class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Gender</label>
        <select formControlName="gender" class="form-select">
          <option value="" disabled selected>Choose...</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <!-- 🔹 Academic Info -->
      <h5 class="border-bottom pb-2 mt-3">Academic Information</h5>

      <div class="col-md-4">
        <label class="form-label">Department</label>
        <input type="text" formControlName="department" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Level</label>
        <select formControlName="level" class="form-select">
          <option value="" disabled selected>Choose...</option>
          <option [value]="1">Level 1</option>
          <option [value]="2">Level 2</option>
          <option [value]="3">Level 3</option>
          <option [value]="4">Level 4</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">GPA</label>
        <input type="number" step="0.01" formControlName="gpa" class="form-control">
      </div>

      <!-- 🔹 Contact Info -->
      <h5 class="border-bottom pb-2 mt-3">Contact Information</h5>

      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="tel" formControlName="phone" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Address</label>
        <input type="text" formControlName="address" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">City</label>
        <input type="text" formControlName="city" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Country</label>
        <select formControlName="country" class="form-select">
          <option value="" disabled selected>Choose...</option>
          <option>Egypt</option>
          <option>Iraq</option>
          <option>Saudi Arabia</option>
          <option>Libya</option>
          <option>Sudan</option>
          <option>Somalia</option>
          <option>Jordan</option>
          <option>Other</option>
        </select>
      </div>

      <!-- 🔹 Other -->
      <h5 class="border-bottom pb-2 mt-3">Other</h5>

      <div class="col-md-6">
        <label class="form-label">Enrollment Date</label>
        <input type="date" formControlName="enrollmentDate" class="form-control">
      </div>

      <div class="col-md-6 d-flex align-items-center">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive">
          <label class="form-check-label" for="isActive">
            Active Student
          </label>
        </div>
      </div>

      <!-- 🔹 Submit -->
      <div class="col-12 text-center mt-4">
        <button type="submit" class="btn btn-primary px-5 py-2 rounded-3">
          Submit
        </button>
      </div>

    </form>
  </div>
</div>
